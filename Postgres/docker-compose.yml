services:
  postgres:
    image: postgres:18.6
    container_name: aicd_postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_AICD_USER: ${POSTGRES_AICD_USER}
      POSTGRES_AICD_PASSWORD: ${POSTGRES_AICD_PASSWORD}
      POSTGRES_AICD_DB: ${POSTGRES_AICD_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./01_aicd_init.sh:/docker-entrypoint-initdb.d/01_aicd_init.sh
    ports:
      - "5432:5432"
    networks:
      - aicd_net

volumes:
  postgres_data:

networks:
  aicd_net:
    external: true
