services:
  postgres:
    image: postgres:18.6
    container_name: aicd_postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_AICD_USER: ${POSTGRES_AICD_USER}
      POSTGRES_AICD_PASSWORD: ${POSTGRES_AICD_PASSWORD}
      POSTGRES_AICD_DB: ${POSTGRES_AICD_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./01_aicd_init.sh:/docker-entrypoint-initdb.d/01_aicd_init.sh
    ports:
      - "5432:5432"
    networks:
      - aicd_net

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: aicd_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      SCRIPT_NAME: /pgadmin
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - aicd_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`${DOMAIN}`) && PathPrefix(`/pgadmin`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.routers.pgadmin.service=pgadmin"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

volumes:
  postgres_data:
  pgadmin_data:

networks:
  aicd_net:
    external: true
