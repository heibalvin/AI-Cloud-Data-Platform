services:
  ollama:
    image: ollama/ollama:0.34.4
    container_name: aicd_ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '5.0'
          memory: 10G
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh
    ports:
      - "11434:11434"
    networks:
      - aicd_net

volumes:
  ollama_data:

networks:
  aicd_net:
    external: true
