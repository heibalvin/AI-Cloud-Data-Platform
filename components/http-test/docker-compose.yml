services:
  http-test:
    image: nginx:1.29.2-alpine
    container_name: aicd-http-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - aicd-net

networks:
  aicd-net:
    external: true
    name: AICD-net
