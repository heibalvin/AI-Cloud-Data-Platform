services:
  test:
    image: nginx:1.31.7-alpine
    container_name: aicd-test
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - aicd-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test.rule=Host(`dev.akashatek.com`) && PathPrefix(`/test`)"
      - "traefik.http.routers.test.entrypoints=web"
      - "traefik.http.services.test.loadbalancer.server.port=80"
