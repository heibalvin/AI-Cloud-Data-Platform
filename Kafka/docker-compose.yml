services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: aicd_kafka
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://aicd_kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@aicd_kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_config:/mnt/shared/config
      - kafka_secrets:/etc/kafka/secrets
    networks:
      - aicd_net

  kafka-ui:
    image: kafbat/kafka-ui:f2a4f9b
    container_name: aicd_kafka_ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: aicd_kafka:9092
      SERVER_SERVLET_CONTEXT_PATH: /kafkaui
    ports:
      - "8081:8080"
    networks:
      - aicd_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafkaui.rule=Host(`${DOMAIN}`) && PathPrefix(`/kafkaui`)"
      - "traefik.http.routers.kafkaui.entrypoints=web"
      - "traefik.http.routers.kafkaui.service=kafkaui"
      - "traefik.http.services.kafkaui.loadbalancer.server.port=8080"

volumes:
  kafka_data:
  kafka_config:
  kafka_secrets:

networks:
  aicd_net:
    external: true
