<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AICD - Ollama Chat via Kafka</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #fafafa; }

/* Topbar - services - fixed at top */
#topbar { display: flex; justify-content: space-around; align-items: center; padding: 16px 20px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; gap: 24px; z-index: 100; flex-shrink: 0; }
.service-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #333; padding: 12px; border-radius: 8px; transition: background 0.2s; min-width: 130px; }
.service-link:hover { background: #f5f5f5; }
.service-logo { width: 96px; height: 96px; object-fit: contain; margin-bottom: 8px; }

@media (max-width: 768px) {
  .service-logo { width: auto; height: 10vh; max-height: 10vh; }
  .service-link { min-width: 100px; padding: 8px; }
  .service-name { font-size: 11px; }
  .service-port { font-size: 9px; }
  #topbar { padding: 10px 12px; gap: 12px; }
}
.service-name { font-size: 13px; font-weight: 500; text-align: center; }
.service-port { font-size: 11px; color: #666; font-family: monospace; }

/* Main content area - below topbar */
#content { display: flex; flex: 1; overflow: hidden; }

/* Left panel - threads */
#sidebar { width: 280px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #fff; flex-shrink: 0; }
#sidebar h2 { padding: 12px; font-size: 16px; border-bottom: 1px solid #ddd; background: #f0f0f0; }
#thread-list { flex: 1; overflow-y: auto; padding: 8px; }
.thread-item { padding: 10px 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.thread-item:hover { background: #f0f0f0; }
.thread-item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; }
.thread-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.thread-delete { color: #d93025; font-size: 12px; margin-left: 8px; cursor: pointer; }

/* Thread creation bar */
#thread-create { padding: 10px; border-bottom: 1px solid #ddd; background: #fff; display: flex; gap: 6px; }
#thread-name { flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
#thread-create-btn { padding: 8px 14px; font-size: 13px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
#thread-create-btn:hover { background: #1557b0; }

/* Center panel - chat */
#main { flex: 1; display: flex; flex-direction: column; background: #fff; }
#chat-header { padding: 12px 16px; border-bottom: 1px solid #ddd; font-weight: 600; font-size: 16px; background: #f8f9fa; }
#chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; background: #e8f0fe; color: #1a73e8; border-bottom-right-radius: 2px; }
.message.assistant { align-self: flex-start; background: #f1f3f4; color: #202124; border-bottom-left-radius: 2px; }
.message .role { font-size: 11px; font-weight: 600; margin-bottom: 4px; opacity: 0.7; text-transform: uppercase; }
.message .status { font-size: 10px; opacity: 0.6; margin-top: 4px; font-style: italic; }
.message.empty { color: #9aa0a6; font-style: italic; max-width: 100%; text-align: center; }

/* Bottom panel - input */
#input-area { padding: 12px 16px; border-top: 1px solid #ddd; background: #f8f9fa; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
#model-input { width: 120px; padding: 8px 12px; font-size: 13px; border: 1px solid #ccc; border-radius: 20px; outline: none; background: #fff; }
#question-input { flex: 1; min-width: 200px; padding: 10px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; background: #fff; resize: none; }
#question-input:focus { border-color: #1a73e8; }
#send-btn { padding: 10px 20px; font-size: 14px; background: #1a73e8; color: white; border: none; border-radius: 20px; cursor: pointer; white-space: nowrap; }
#send-btn:hover { background: #1557b0; }
#send-btn:disabled { background: #bdc1c6; cursor: not-allowed; }

/* Log panel */
#log-toggle { position: fixed; bottom: 10px; left: 10px; z-index: 1000; padding: 6px 10px; font-size: 11px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
#log-toggle:hover { background: #1557b0; }
#log-panel { position: fixed; bottom: 40px; left: 10px; width: 320px; z-index: 1000; max-height: 200px; background: #1e1e1e; color: #d4d4d4; font-family: 'Menlo','Consolas',monospace; font-size: 11px; padding: 8px; border-radius: 6px; overflow-y: auto; display: none; border: 1px solid #333; }
#log-panel.show { display: block; }
.log-line { margin: 2px 0; white-space: pre-wrap; word-break: break-all; }
.log-ts { color: #888; }
.log-msg { color: #4fc3f7; }
.log-error { color: #ff8a80; }
</style>
</head>
<body>
<!-- Topbar - Services -->
<nav id="topbar">
  <a class="service-link" href="http://localhost:80" title="Nginx Chat Frontend">
    <img class="service-logo" src="/Assets/logo-nginx.png" alt="Nginx">
    <span class="service-name">Nginx Chat</span>
    <span class="service-port">:80</span>
  </a>
  <a class="service-link" href="http://localhost:11434" title="Ollama LLM API" target="_blank">
    <img class="service-logo" src="/Assets/logo-ollama.png" alt="Ollama">
    <span class="service-name">Ollama</span>
    <span class="service-port">:11434</span>
  </a>
  <a class="service-link" href="http://localhost:9092" title="Kafka Broker" target="_blank">
    <img class="service-logo" src="/Assets/logo-kafka.png" alt="Kafka">
    <span class="service-name">Kafka</span>
    <span class="service-port">:9092</span>
  </a>
  <a class="service-link" href="http://localhost:8081" title="Kafka UI" target="_blank">
    <img class="service-logo" src="/Assets/logo-kafka-ui.png" alt="Kafka UI">
    <span class="service-name">Kafka UI</span>
    <span class="service-port">:8081</span>
  </a>
  <a class="service-link" href="http://localhost:5432" title="Postgres Database" target="_blank">
    <img class="service-logo" src="/Assets/logo-postgres.png" alt="Postgres">
    <span class="service-name">Postgres</span>
    <span class="service-port">:5432</span>
  </a>
  <a class="service-link" href="http://localhost:8082" title="pgAdmin" target="_blank">
    <img class="service-logo" src="/Assets/logo-pgadmin.png" alt="pgAdmin">
    <span class="service-name">pgAdmin</span>
    <span class="service-port">:8082</span>
  </a>
</nav>

<!-- Main content area - below topbar -->
<div id="content">
  <div id="sidebar">
  <h2>Threads</h2>
  <div id="thread-create">
    <input id="thread-name" type="text" placeholder="New thread name">
    <button id="thread-create-btn">Create</button>
  </div>
  <div id="thread-list"></div>
</div>
<div id="main">
  <div id="chat-header">Select a thread</div>
  <div id="chat-messages">
    <div id="empty-state" class="message empty">Select a thread or create a new one.</div>
  </div>
  <div id="input-area">
    <select id="model-input">
      <option value="llama3.1:8b">llama3.1:8b</option>
      <option value="llama3.2:3b">llama3.2:3b</option>
      <option value="mistral:7b">mistral:7b</option>
    </select>
    <textarea id="question-input" rows="1" placeholder="Type a message..."></textarea>
    <button id="send-btn">ASK</button>
  </div>
</div>
</div>

<!-- Log panel -->
<button id="log-toggle">Show logs</button>
<div id="log-panel"></div>

<script>
const API = '/api';
let currentThreadId = null;
let pollTimer = null;
let lastSentAt = null;

const sidebar = document.getElementById('sidebar');
const threadListEl = document.getElementById('thread-list');
const threadNameInput = document.getElementById('thread-name');
const threadCreateBtn = document.getElementById('thread-create-btn');
const chatHeader = document.getElementById('chat-header');
const chatMessages = document.getElementById('chat-messages');
const emptyState = document.getElementById('empty-state');
const questionInput = document.getElementById('question-input');
const sendBtn = document.getElementById('send-btn');
const modelInput = document.getElementById('model-input');

// In-page log panel
(function(){
  var btn = document.getElementById('log-toggle');
  var panel = document.getElementById('log-panel');
  var visible = false;
  btn.onclick = function(){
    visible = !visible;
    panel.className = visible ? 'log-panel show' : 'log-panel';
    btn.textContent = visible ? 'Hide logs' : 'Show logs';
  };
  window.log = function(msg, type){
    var line = document.createElement('div');
    line.className = 'log-line ' + (type || '');
    var ts = new Date().toLocaleTimeString();
    line.innerHTML = '<span class="log-ts">[' + ts + ']</span> <span class="log-' + (type==='error'?'error':'msg') + '">' + escapeHtml(String(msg)) + '</span>';
    panel.appendChild(line);
    panel.scrollTop = panel.scrollHeight;
    console[type==='error'?'error':'log']('[nginx]', msg);
  };
})();

async function loadThreads() {
  try {
    const res = await fetch(`${API}/threads`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const threads = await res.json();
    threadListEl.innerHTML = '';
    threads.forEach(t => {
      const div = document.createElement('div');
      div.className = 'thread-item' + (currentThreadId === t.id ? ' active' : '');
      div.innerHTML = `<span class="thread-title">${escapeHtml(t.title)}</span><span class="thread-delete" onclick="event.stopPropagation(); deleteThread('${t.id}');">×</span>`;
      div.onclick = () => loadThread(t.id);
      threadListEl.appendChild(div);
    });
    // Check for "Global Chat" thread, create if missing
    let globalThread = threads.find(t => t.title === 'Global Chat');
    if (!globalThread && threads.length > 0) {
      globalThread = threads[0]; // fallback to first thread
    }
    if (!globalThread) {
      // Create Global Chat thread
      const res = await fetch(`${API}/threads`, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ title: 'Global Chat' }) 
      });
      if (res.ok) {
        const t = await res.json();
        globalThread = t;
        // Add to list
        const div = document.createElement('div');
        div.className = 'thread-item active';
        div.innerHTML = `<span class="thread-title">Global Chat</span><span class="thread-delete" onclick="event.stopPropagation(); deleteThread('${t.id}');">×</span>`;
        div.onclick = () => loadThread(t.id);
        threadListEl.prepend(div);
      }
    }
    // Auto-select "Global Chat" ONLY if no thread is currently selected
    if (!currentThreadId && globalThread) {
      loadThread(globalThread.id);
    } else if (!currentThreadId && threads.length === 0) {
      currentThreadId = null;
      chatHeader.textContent = 'Select a thread';
      emptyState.style.display = 'flex';
      chatMessages.innerHTML = '';
    }
  } catch (e) {
    log('Failed to load threads: ' + e.message, 'error');
    threadListEl.innerHTML = '<div style="padding: 16px; color: #d93025; text-align: center;">Cannot connect to chat backend.<br>Is <code>aicd_chat</code> running?</div>';
    chatHeader.textContent = 'Chat backend unavailable';
    emptyState.style.display = 'flex';
    emptyState.textContent = 'Chat service is not running. Start it with: docker compose up -d chat';
    chatMessages.innerHTML = '';
  }
}

async function loadThread(threadId) {
  currentThreadId = threadId;
  if (pollTimer) clearInterval(pollTimer);
  try {
    const res = await fetch(`${API}/threads/${threadId}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    chatHeader.textContent = data.thread.title;
    emptyState.style.display = 'none';
    chatMessages.innerHTML = '';
    data.messages.forEach(m => appendMessage(m.role, m.content, m.created_at));
    scrollBottom();
  } catch (e) {
    log('Failed to load thread: ' + e.message, 'error');
    chatHeader.textContent = 'Error loading thread';
    emptyState.style.display = 'flex';
    emptyState.textContent = 'Cannot connect to chat backend.';
    chatMessages.innerHTML = '';
  }
}

async function createThread() {
  const name = threadNameInput.value.trim();
  const body = name ? { title: name } : {};
  const res = await fetch(`${API}/threads`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) {
    log('Failed to create thread: ' + res.status, 'error');
    return;
  }
  const t = await res.json();
  threadNameInput.value = '';
  currentThreadId = t.id;
  loadThread(t.id);
  loadThreads();
}

async function deleteThread(threadId) {
  await fetch(`${API}/threads/${threadId}`, { method: 'DELETE' });
  if (currentThreadId === threadId) {
    currentThreadId = null;
    chatHeader.textContent = 'Select a thread';
    emptyState.style.display = 'flex';
    chatMessages.innerHTML = '';
    if (pollTimer) clearInterval(pollTimer);
  }
  loadThreads();
}

function appendMessage(role, content, createdAt) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const statusHtml = role === 'user' ? `<div class="status">Pushing to Kafka (chat.requests)...</div>` : '';
  div.innerHTML = `<div class="role">${role === 'user' ? 'You' : 'Ollama'}</div><div>${escapeHtml(content || '')}</div>${statusHtml}`;
  chatMessages.appendChild(div);
  return div;
}

async function sendMessage() {
  const text = questionInput.value.trim();
  if (!text || !currentThreadId) return;
  questionInput.value = '';
  questionInput.style.height = 'auto';
  sendBtn.disabled = true;

  const userDiv = appendMessage('user', text);
  scrollBottom();

  lastSentAt = new Date().toISOString();

  log('Pushing message to Kafka chat.requests: thread_id=' + currentThreadId + ', model=' + modelInput.value + ', message=' + text);

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: currentThreadId, message: text, model: modelInput.value }),
    });
    const data = await res.json();
    currentThreadId = data.thread_id || currentThreadId;
    log('Message queued via Kafka: ' + JSON.stringify(data));
    userDiv.querySelector('.status').textContent = 'Sent via Kafka → awaiting Ollama answer...';
  } catch (e) {
    log('Error pushing to Kafka: ' + e.message, 'error');
    appendMessage('assistant', 'Error queuing message: ' + e.message);
    scrollBottom();
    sendBtn.disabled = false;
    return;
  }

  startPolling(currentThreadId);
}

function startPolling(threadId) {
  if (pollTimer) clearInterval(pollTimer);
  const sentAfter = lastSentAt;
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${API}/threads/${threadId}/response`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.status === 'done' && data.response && (!sentAfter || data.created_at > sentAfter)) {
        log('Received response from Kafka chat.responses: ' + JSON.stringify(data));
        const existing = chatMessages.querySelector('.message.assistant:last-child');
        const lastUser = chatMessages.querySelector('.message.user:last-child');
        if (lastUser && (!existing || existing.previousElementSibling !== lastUser)) {
          appendMessage('assistant', data.response, data.created_at);
          const lastMsg = chatMessages.querySelector('.message.assistant:last-child');
          const statusEl = lastMsg ? lastMsg.querySelector('.status') : null;
          if (statusEl) statusEl.textContent = 'Received from Kafka → Ollama';
          scrollBottom();
        }
        clearInterval(pollTimer);
        pollTimer = null;
        sendBtn.disabled = false;
      }
    } catch (e) {
      log('Polling error: ' + e.message, 'error');
      // Don't clear timer - keep polling, but show error in UI
      const statusEl = chatMessages.querySelector('.message.user:last-child .status');
      if (statusEl) statusEl.textContent = 'Connection lost to chat backend...';
    }
  }, 1500);
}

function scrollBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

questionInput.addEventListener('input', () => {
  questionInput.style.height = 'auto';
  questionInput.style.height = questionInput.scrollHeight + 'px';
});
questionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
sendBtn.addEventListener('click', sendMessage);
threadCreateBtn.addEventListener('click', createThread);

loadThreads();
</script>
</body>
</html>
