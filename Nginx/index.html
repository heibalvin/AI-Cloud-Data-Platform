<!DOCTYPE html>
<html>
<head><title>AICD</title></head>
<body>
<h1>AICD</h1>
<table>
<tr><td><img src="/Assets/logo-nginx.png" width="24"></td><td><a href="/">Nginx</a></td></tr>
<tr><td><img src="/Assets/logo-kafka.png" width="24"></td><td><a href="/kafkaui">Kafka UI</a></td></tr>

</table>
<h2>Ollama</h2>
👤 <input id="prompt" size="40" placeholder="Ask Ollama">
<button onclick="ask()">Ask</button>
🤖 <pre id="answer" style="display:inline"></pre>
<script>
async function ask(){
  const p=document.getElementById('prompt').value;
  const r=await fetch('http://local.akashatek.com:11434/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'llama3.1:8b',prompt:p,stream:false})});
  const j=await r.json();
  document.getElementById('answer').textContent=j.response||JSON.stringify(j);
}
</script>
</body>
</html>
