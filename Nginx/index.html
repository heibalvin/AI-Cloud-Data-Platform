<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AICD - Nginx / Kafka / Postgres</title>
<style>
body{font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;}
.zone{padding:10px;border-bottom:1px solid #ccc;}
.top{height:60px;display:flex;align-items:center;gap:10px;}
.central,.bottom{flex:1;overflow:auto;}
h3{margin:0 0 5px;}
.list{border:1px solid #ddd;height:200px;overflow:auto;padding:5px;font-family:monospace;font-size:12px;}
</style>
</head>
<body>
<div class="zone top">
  <label>Timeframe: <input type="text" id="timeframe" value="last 1h"></label>
  <button id="save">Save</button>
</div>
<div class="zone central">
  <h3>Kafka topic events</h3>
  <div class="list" id="kafkaList"></div>
</div>
<div class="zone bottom">
  <h3>Postgres table rows</h3>
  <div class="list" id="pgList"></div>
</div>
<script>
const kafka=document.getElementById('kafkaList');
const pg=document.getElementById('pgList');
function add(list,msg){const d=document.createElement('div');d.textContent=new Date().toISOString()+' '+msg;list.prepend(d);}
setInterval(()=>add(kafka,'event received'),2000);
setInterval(()=>add(pg,'row updated'),3000);
document.getElementById('save').onclick=()=>add(pg,'saved timeframe '+document.getElementById('timeframe').value);
</script>
</body>
</html>
