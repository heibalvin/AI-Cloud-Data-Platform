services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${NGINX_VERSION:-1.1.1}
    image: aicd-nginx:${NGINX_VERSION:-1.1.1}
    container_name: aicd_nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    ports:
      - "80:80"
    networks:
      - aicd_net

volumes:
  nginx_data:

networks:
  aicd_net:
    external: true
